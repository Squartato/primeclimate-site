<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Объект — Prime Climate Engineering</title>
<link rel="icon" type="image/png" href="../logo.png">
<meta name="theme-color" content="#0b2a4a">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:Georgia,serif;background:#f4f8fe;color:#0b2a4a;line-height:1.6;overflow-x:hidden}
a{color:#0b2a4a;text-decoration:none;transition:color .2s}
a:hover{color:#b8860b}
img{max-width:100%;display:block}
.container{max-width:1100px;margin:0 auto;padding:0 20px}
.top-bar{background:linear-gradient(90deg,#0b2a4a,#1a3c5e);color:#fff;padding:10px 0;font-family:Arial,sans-serif;font-size:13px}
.top-bar .container{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.top-bar a{color:#fff}
.top-bar a:hover{color:#ffd700}
.top-bar .contacts{display:flex;gap:20px;flex-wrap:wrap;align-items:center}
header.main-header{background:#fff;border-bottom:3px solid #0b2a4a;padding:12px 0;box-shadow:0 2px 20px rgba(11,42,74,.1)}
.main-header .container{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:15px}
.logo-block{display:flex;align-items:center;gap:15px}
.logo-block img{height:50px}
.brand-name{font-family:Arial,sans-serif;font-size:18px;font-weight:700;color:#0b2a4a;letter-spacing:1px;line-height:1.1}
.brand-slogan{font-size:11px;color:#b8860b;font-style:italic;letter-spacing:.5px;margin-top:2px}
.back-link{font-family:Arial,sans-serif;font-size:13px;font-weight:600;color:#0b2a4a;text-transform:uppercase;letter-spacing:1px}
.back-link:hover{color:#b8860b}
.hero-obj{background:linear-gradient(135deg,#0b2a4a 0%,#1a3c5e 60%,#2c4a6a 100%);color:#fff;padding:50px 0}
.hero-obj h1{font-family:Arial,sans-serif;font-size:34px;font-weight:800;margin-bottom:16px;line-height:1.15}
.hero-obj .obj-badge{display:inline-block;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.4);color:#ffd700;font-family:Arial,sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:6px 14px;border-radius:20px;margin-bottom:18px}
.hero-obj p{font-size:16px;color:#e8eff9;max-width:800px;line-height:1.7}
.obj-info{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:35px}
.obj-info .info-item{background:rgba(255,255,255,.06);border-left:3px solid #ffd700;padding:20px 24px;border-radius:8px}
.obj-info .info-item .lbl{font-family:Arial,sans-serif;font-size:11px;color:#ffd700;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px}
.obj-info .info-item .val{font-family:Arial,sans-serif;font-size:18px;font-weight:700;color:#fff}
.section{padding:60px 0}
.section-header{text-align:center;margin-bottom:40px}
.section-header .eyebrow{display:block;font-family:Arial,sans-serif;font-size:11px;color:#b8860b;text-transform:uppercase;letter-spacing:4px;margin-bottom:12px;font-weight:600}
.section-header h2{font-size:30px;color:#0b2a4a;font-weight:700;line-height:1.2}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:30px}
.gallery .g-item{position:relative;aspect-ratio:1/1;overflow:hidden;border-radius:10px;cursor:zoom-in;background:#0b2a4a}
.gallery .g-item img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.gallery .g-item:hover img{transform:scale(1.08)}
.gallery .g-item.g-wide{grid-column:span 2;aspect-ratio:2/1}
.lightbox{position:fixed;inset:0;background:rgba(8,20,35,.96);display:none;align-items:center;justify-content:center;z-index:9999;padding:40px}
.lightbox.open{display:flex}
.lightbox img{max-width:90vw;max-height:85vh;object-fit:contain;border-radius:8px}
.lightbox-close{position:absolute;top:20px;right:25px;font-size:36px;color:#fff;cursor:pointer;line-height:1;background:none;border:none;font-family:Arial,sans-serif}
.lightbox-close:hover{color:#ffd700}
.lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);font-size:48px;color:#fff;cursor:pointer;background:none;border:none;padding:10px 20px;font-family:Arial,sans-serif;user-select:none}
.lightbox-nav:hover{color:#ffd700}
.lightbox-prev{left:15px}
.lightbox-next{right:15px}
.lightbox-counter{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:#fff;font-family:Arial,sans-serif;font-size:14px;letter-spacing:1px}
.video-wrap{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:10px}
.video-item{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#0b2a4a;box-shadow:0 10px 30px rgba(11,42,74,.15)}
.video-item iframe{position:absolute;inset:0;width:100%;height:100%;border:none}
.cta-obj{background:linear-gradient(135deg,#b8860b,#d4a017,#b8860b);color:#fff;padding:45px 0;text-align:center;margin-top:40px}
.cta-obj h3{font-size:26px;margin-bottom:12px}
.cta-obj p{font-size:15px;margin-bottom:24px;opacity:.95}
.cta-obj .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:Arial,sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:14px 26px;border-radius:6px;cursor:pointer;transition:all .3s;border:none;text-decoration:none}
.btn-navy{background:#0b2a4a;color:#fff}
.btn-navy:hover{background:#1a3c5e;color:#fff;transform:translateY(-2px)}
.btn-white{background:#fff;color:#0b2a4a}
.btn-white:hover{background:#fff8d8;color:#0b2a4a;transform:translateY(-2px)}
footer{background:linear-gradient(180deg,#08192b,#0a1f35);color:#a8b8c8;padding:40px 0 20px;font-family:Arial,sans-serif;font-size:13.5px}
.footer-bottom{border-top:1px solid #1a2c3e;padding-top:20px;text-align:center;font-size:12px;color:#6a7a8a;line-height:1.8}
.footer-bottom a{color:#8a9aae;text-decoration:underline}
.notfound{text-align:center;padding:80px 20px}
.notfound h1{font-size:28px;margin-bottom:16px}
.notfound a{color:#b8860b;text-decoration:underline}
@media(max-width:900px){
.hero-obj h1{font-size:26px}
.obj-info{grid-template-columns:1fr;gap:14px}
.gallery{grid-template-columns:repeat(2,1fr);gap:10px}
.gallery .g-item.g-wide{grid-column:span 2}
.video-wrap{grid-template-columns:1fr}
}
@media(max-width:600px){
.main-header .container{flex-direction:column;align-items:flex-start}
.gallery{grid-template-columns:1fr;gap:10px}
.gallery .g-item.g-wide{grid-column:span 1;aspect-ratio:1/1}
.lightbox-nav{font-size:36px;padding:5px 12px}
}
</style>
</head>
<body>

<div class="contacts">

</div>

</div></div>

<div>

<div class="brand-slogan">Инженерные решения для жизни</div>
</div>
</div>

<div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">×</button>
    <button class="lightbox-nav lightbox-prev" onclick="navLightbox(-1)">‹</button>
    <img id="lightbox-img" src="" alt="">
    <button class="lightbox-nav lightbox-next" onclick="navLightbox(1)">›</button>
    <div class="lightbox-counter" id="lightbox-counter"></div>
</div>

<script src="../works-data.js"></script>
<script>
(function(){
    function photoUrl(id, num){
        return '../gallery/object-' + id + '/' + String(num).padStart(2, '0') + '.jpg';
    }
    function getParam(name){
        var m = new RegExp('[?&]' + name + '=([^&]+)').exec(window.location.search);
        return m ? decodeURIComponent(m[1]) : null;
    }
    var id = parseInt(getParam('id'), 10);
    var work = window.WORKS.find(function(w){ return w.id === id; });
    var content = document.getElementById('content');

    if(!work){
        content.innerHTML = '<div class="notfound"><h1>Объект не найден</h1><p>Возможно, ссылка устарела или объект удалён.</p><p style="margin-top:20px"><a href="../portfolio.html">← Вернуться к списку работ</a></p></div>';
        return;
    }

    document.title = work.title + ' — Prime Climate Engineering';

    var infoHtml = '';
    if(work.info){
        infoHtml = '<div class="obj-info">' +
            Object.keys(work.info).map(function(k){
                return '<div class="info-item"><div class="lbl">' + k + '</div><div class="val">' + work.info[k] + '</div></div>';
            }).join('') +
            '</div>';
    }

    var galleryHtml = '<div class="gallery" id="gallery">';
    for(var i = 1; i <= work.photos; i++){
        var num = String(i).padStart(2, '0');
        var wide = (i === 1 || i === 7 || i === 13) ? ' g-wide' : '';
        galleryHtml += '<div class="g-item' + wide + '"><img src="' + photoUrl(work.id, num) + '" alt="Фото ' + i + '" loading="lazy"></div>';
    }
    galleryHtml += '</div>';

    var videoHtml = '';
    if(work.videos && work.videos.length > 0){
        videoHtml = '<section class="section" style="padding-top:0"><div class="container">' +
            '<div class="section-header"><div class="eyebrow">Видео с объекта</div><h2>Как мы работали</h2></div>' +
            '<div class="video-wrap">' +
            work.videos.map(function(src){
                return '<div class="video-item"><iframe src="' + src + '" allowfullscreen loading="lazy"></iframe></div>';
            }).join('') +
            '</div></div></section>';
    }

    content.innerHTML =
        '<section class="hero-obj"><div class="container">' +
            '<div class="obj-badge">Объект № ' + work.id + ' · ' + work.type + '</div>' +
            '<h1>' + work.title + '</h1>' +
            '<p>' + work.desc + '</p>' +
            infoHtml +
        '</div></section>' +
        '<section class="section"><div class="container">' +
            '<div class="section-header"><div class="eyebrow">Фотогалерея</div><h2>Как это выглядит</h2></div>' +
            galleryHtml +
        '</div></section>' +
        videoHtml +
        '<section class="cta-obj"><div class="container">' +
            '<h3>Хотите так же?</h3>' +
            '<p>Оставьте заявку — приедем на бесплатный замер и рассчитаем стоимость</p>' +
            '<div class="btns">' +
                '<a href="../index.html#contact" class="btn btn-navy">📋 Оставить заявку</a>' +
                '<a href="tel:+79939527720" class="btn btn-white">📞 8-993-952-77-20</a>' +
            '</div>' +
        '</div></section>';

    var gallery = document.getElementById('gallery');
    var items = gallery.querySelectorAll('.g-item img');
    var current = 0;
    var lightbox = document.getElementById('lightbox');
    var img = document.getElementById('lightbox-img');
    var counter = document.getElementById('lightbox-counter');

    items.forEach(function(el, idx){
        el.parentElement.addEventListener('click', function(){
            current = idx;
            openLightbox();
        });
    });

    function openLightbox(){
        lightbox.classList.add('open');
        img.src = items[current].src;
        counter.textContent = (current+1) + ' / ' + items.length;
        document.body.style.overflow = 'hidden';
    }
    window.closeLightbox = function(){
        lightbox.classList.remove('open');
        document.body.style.overflow = '';
    };
    window.navLightbox = function(dir){
        current = (current + dir + items.length) % items.length;
        img.src = items[current].src;
        counter.textContent = (current+1) + ' / ' + items.length;
    };

    document.addEventListener('keydown', function(e){
        if(!lightbox.classList.contains('open')) return;
        if(e.key === 'Escape') closeLightbox();
        if(e.key === 'ArrowLeft') navLightbox(-1);
        if(e.key === 'ArrowRight') navLightbox(1);
    });
    lightbox.addEventListener('click', function(e){
        if(e.target === lightbox) closeLightbox();
    });
})();
</script>

</body>
